<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221d18" media="(prefers-color-scheme: dark)" />
    <title>PartnR — Trouvez votre partenaire d'activité</title>
    <meta
      name="description"
      content="Course à pied, resto, concert, expo… PartnR vous connecte avec des gens près de chez vous qui partagent vos envies."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PartnR" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="PartnR — Ne faites plus rien seul·e" />
    <meta
      property="og:description"
      content="Course à pied, resto, concert, expo… Trouvez des partenaires près de chez vous pour toutes vos activités."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PartnR — Ne faites plus rien seul·e" />
    <meta
      name="twitter:description"
      content="Course à pied, resto, concert, expo… Trouvez des partenaires près de chez vous pour toutes vos activités."
    />
    <meta name="twitter:image" content="/og-default.png" />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
